<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>C&oacute;digos gerados &mdash; N&uacute;cleo Exato</title>
<link rel="stylesheet" href="css/estilo.css">
<style>
.painel-wrap{max-width:960px;margin:0 auto;padding:40px 20px}
.painel-wrap h1{margin-bottom:6px}
.aviso{color:var(--suave);font-size:13.5px;margin-bottom:22px}
.busca{width:100%;max-width:420px;padding:10px 12px;border:1px solid var(--borda);border-radius:10px;font-size:14px;margin-bottom:18px;font-family:inherit}
.tabela-wrap{overflow-x:auto;border:1px solid var(--borda);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--borda);white-space:nowrap}
th{background:var(--claro);font-weight:700}
tr:last-child td{border-bottom:0}
code.cod{font-weight:700;letter-spacing:1px}
.sku{font-size:11.5px;font-weight:700;color:var(--suave)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}
.badge-ativo{background:#e6f4ec;color:#1f7a4d}
.badge-usado{background:#eaf1fb;color:#2b5fa8}
.badge-vencido{background:#fbeaea;color:#a83b3b}
.vazio,.carregando{text-align:center;color:var(--suave);padding:40px 0}
.atualizar{margin-top:14px;background:none;border:1px solid var(--verde);color:var(--verde);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13.5px}
</style>
</head>
<body>
<div class="painel-wrap">
  <h1>C&oacute;digos de acesso gerados</h1>
  <p class="aviso">Hist&oacute;rico completo &mdash; busca por c&oacute;digo, SKU, produto ou nota (pedido/comprador).</p>

  <input class="busca" id="busca" placeholder="Buscar por c&oacute;digo, SKU, produto ou nota&hellip;" oninput="filtrar()">

  <div class="tabela-wrap">
    <table id="tabela">
      <thead>
        <tr>
          <th>C&oacute;digo</th>
          <th>SKU</th>
          <th>Produto</th>
          <th>Nota</th>
          <th>Gerado em</th>
          <th>Expira em</th>
          <th>Status</th>
          <th>Usos</th>
        </tr>
      </thead>
      <tbody id="corpo">
        <tr><td colspan="8" class="carregando">Carregando&hellip;</td></tr>
      </tbody>
    </table>
  </div>
  <button class="atualizar" onclick="carregar()">Atualizar lista</button>
</div>

<script>
let todos = [];

function senhaSalva() {
  let s = sessionStorage.getItem("senha_admin_ne");
  if (!s) {
    s = prompt("Senha de administrador:");
    if (s) sessionStorage.setItem("senha_admin_ne", s);
  }
  return s || "";
}

function formatarData(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function badge(status) {
  const rotulo = { ativo: "Ativo", usado: "Usado", vencido: "Vencido", desconhecido: "—" }[status] || status;
  return '<span class="badge badge-' + status + '">' + rotulo + '</span>';
}

async function carregar() {
  document.getElementById("corpo").innerHTML = '<tr><td colspan="8" class="carregando">Carregando…</td></tr>';
  let resp;
  try {
    resp = await fetch("/api/listar", { headers: { "x-senha": senhaSalva() } });
  } catch (e) {
    document.getElementById("corpo").innerHTML = '<tr><td colspan="8" class="vazio">Não consegui falar com o servidor.</td></tr>';
    return;
  }
  if (resp.status === 401) {
    sessionStorage.removeItem("senha_admin_ne");
    alert("Senha incorreta. Tente de novo.");
    document.getElementById("corpo").innerHTML = '<tr><td colspan="8" class="vazio">Senha incorreta.</td></tr>';
    return;
  }
  const dados = await resp.json();
  todos = dados.codigos || [];
  renderizar(todos);
}

function renderizar(lista) {
  const corpo = document.getElementById("corpo");
  if (!lista.length) {
    corpo.innerHTML = '<tr><td colspan="8" class="vazio">Nenhum código gerado ainda.</td></tr>';
    return;
  }
  corpo.innerHTML = lista.map(function (c) {
    return "<tr>" +
      "<td><code class=\"cod\">" + c.codigo + "</code></td>" +
      "<td class=\"sku\">" + (c.sku || "—") + "</td>" +
      "<td>" + (c.produto || "—") + "</td>" +
      "<td>" + (c.nota || "—") + "</td>" +
      "<td>" + formatarData(c.criadoEm) + "</td>" +
      "<td>" + formatarData(c.expiraEm) + "</td>" +
      "<td>" + badge(c.status) + "</td>" +
      "<td>" + (c.usos || 0) + "</td>" +
      "</tr>";
  }).join("");
}

function filtrar() {
  const termo = document.getElementById("busca").value.trim().toLowerCase();
  if (!termo) { renderizar(todos); return; }
  renderizar(todos.filter(function (c) {
    return (c.codigo + " " + c.sku + " " + c.produto + " " + c.nota).toLowerCase().includes(termo);
  }));
}

carregar();
</script>
</body>
</html>
